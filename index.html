<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Interview Prep Hub — language-level interview questions, exercises and visualizations for Python, JavaScript and TypeScript, with answers in English and Bangla."
    />
    <title>Interview Prep Hub</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('iph:theme') || 'null');
          var theme = (saved && saved.state && saved.state.theme) || 'system';
          var dark =
            theme === 'dark' ||
            (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {
          /* storage unavailable: fall back to light */
        }
        // The splash loader shows once per browser session (src/lib/splash.ts removes it).
        try {
          if (sessionStorage.getItem('iph:splash')) {
            document.documentElement.classList.add('no-splash');
          }
        } catch (e) {
          /* storage unavailable: show it */
        }
      })();
    </script>
    <style>
      /* First-load splash. Plain CSS (not Tailwind) so it paints before the app stylesheet. */
      #splash {
        --s-bg: #fcfcfd;
        --s-fg: #18181b;
        --s-muted: #5b5b66;
        --s-track: #ececf1;
        --s-glow: rgb(109 90 230 / 0.16);
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 1.5rem;
        background:
          radial-gradient(42rem 28rem at 50% 42%, var(--s-glow), transparent 70%), var(--s-bg);
        color: var(--s-fg);
        font-family:
          'Geist Variable',
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        transition:
          opacity 0.45s ease,
          visibility 0.45s ease,
          transform 0.45s ease;
        /* Safety net: never stays up if the app fails to start. */
        animation: splash-fallback 0.3s ease 6s forwards;
      }
      .dark #splash {
        --s-bg: #0b0b0e;
        --s-fg: #ededf0;
        --s-muted: #a3a3af;
        --s-track: #1f1f27;
        --s-glow: rgb(143 127 245 / 0.2);
      }
      .no-splash #splash {
        display: none;
      }
      #splash.splash-out {
        opacity: 0;
        visibility: hidden;
        transform: scale(1.02);
      }
      #splash .splash-mark {
        position: relative;
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1.25rem;
        background: linear-gradient(140deg, #8f7ff5, #6d5ae6 55%, #5643cf);
        box-shadow:
          0 18px 40px -12px rgb(109 90 230 / 0.55),
          inset 0 1px 0 rgb(255 255 255 / 0.25);
        display: grid;
        place-items: center;
        animation: splash-rise 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      #splash .splash-mark::after {
        content: '';
        position: absolute;
        inset: -0.5rem;
        border-radius: 1.6rem;
        border: 2px solid rgb(143 127 245 / 0.45);
        animation: splash-ring 1.6s ease-out 0.3s infinite;
      }
      #splash .splash-mark path {
        stroke-dasharray: 24;
        stroke-dashoffset: 24;
        animation: splash-draw 0.45s ease 0.1s forwards;
      }
      #splash .splash-mark path + path {
        animation-delay: 0.22s;
      }
      #splash .splash-name {
        margin: 0.25rem 0 0;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: -0.02em;
        animation: splash-fade 0.45s ease 0.12s both;
      }
      #splash .splash-tag {
        margin: -0.75rem 0 0;
        font-size: 0.8125rem;
        color: var(--s-muted);
        text-align: center;
        text-wrap: balance;
        max-width: 22rem;
        animation: splash-fade 0.45s ease 0.2s both;
      }
      #splash .splash-bar {
        position: relative;
        width: 10rem;
        height: 3px;
        margin-top: 0.5rem;
        border-radius: 999px;
        background: var(--s-track);
        overflow: hidden;
        animation: splash-fade 0.45s ease 0.28s both;
      }
      #splash .splash-bar::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #8f7ff5, #6d5ae6, transparent);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.92);
        }
      }
      @keyframes splash-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes splash-ring {
        0% {
          opacity: 0.9;
          transform: scale(0.94);
        }
        100% {
          opacity: 0;
          transform: scale(1.25);
        }
      }
      @keyframes splash-fade {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(260%);
        }
      }
      @keyframes splash-fallback {
        to {
          opacity: 0;
          visibility: hidden;
        }
      }
      /*
       * Boot loader: what #root shows until the app renders (every refresh in dev, and pages
       * that are not prerendered). InitialFallback.tsx renders the same markup.
       */
      .boot {
        --s-bg: #fcfcfd;
        --s-track: #ececf1;
        --s-glow: rgb(109 90 230 / 0.1);
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background:
          radial-gradient(30rem 20rem at 50% 45%, var(--s-glow), transparent 70%), var(--s-bg);
      }
      .dark .boot {
        --s-bg: #0b0b0e;
        --s-track: #1f1f27;
        --s-glow: rgb(143 127 245 / 0.14);
      }
      .boot-mark {
        width: 3.25rem;
        height: 3.25rem;
        border-radius: 0.95rem;
        background: linear-gradient(140deg, #8f7ff5, #6d5ae6 55%, #5643cf);
        box-shadow:
          0 14px 32px -12px rgb(109 90 230 / 0.6),
          inset 0 1px 0 rgb(255 255 255 / 0.25);
        display: grid;
        place-items: center;
        animation: boot-breathe 1.6s ease-in-out infinite;
      }
      .boot-bar {
        position: relative;
        width: 7rem;
        height: 3px;
        border-radius: 999px;
        background: var(--s-track);
        overflow: hidden;
      }
      .boot-bar::before {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #8f7ff5, #6d5ae6, transparent);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      .boot-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      @keyframes boot-breathe {
        50% {
          transform: scale(0.94);
          box-shadow:
            0 8px 20px -10px rgb(109 90 230 / 0.5),
            inset 0 1px 0 rgb(255 255 255 / 0.25);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark,
        .boot-bar::before {
          animation: none;
        }
        .boot-bar::before {
          width: 100%;
          opacity: 0.5;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash,
        #splash *,
        #splash *::before,
        #splash *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.15s !important;
        }
        #splash {
          animation: splash-fallback 0.15s ease 6s forwards !important;
        }
        #splash .splash-mark path {
          stroke-dashoffset: 0;
        }
        #splash .splash-bar::before {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <!-- First-load splash: decorative (the page behind it is already readable by assistive tech). -->
    <div id="splash" aria-hidden="true">
      <div class="splash-mark">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <path
            d="M12 10.5 6.5 16l5.5 5.5"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M20 10.5l5.5 5.5-5.5 5.5"
            stroke="#fff"
            stroke-width="2.6"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </svg>
      </div>
      <p class="splash-name">Interview Prep Hub</p>
      <p class="splash-tag">Python · JavaScript · TypeScript · SQL · LeetCode · Guides</p>
      <div class="splash-bar"></div>
    </div>
    <div id="root">
      <!-- Boot loader: shows until the app renders; React replaces it (same as InitialFallback). -->
      <div class="boot" role="status">
        <div class="boot-mark">
          <svg width="28" height="28" viewBox="0 0 32 32" fill="none" aria-hidden="true">
            <path
              d="M12 10.5 6.5 16l5.5 5.5M20 10.5l5.5 5.5-5.5 5.5"
              stroke="#fff"
              stroke-width="2.6"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="boot-bar"></div>
        <span class="boot-sr">Loading Interview Prep Hub…</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
